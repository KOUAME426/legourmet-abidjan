<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Le Gourmet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- ========== ÉCRAN DE CONNEXION ========== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>Administration</h1>
      <p class="login-subtitle">Le Gourmet d'Abidjan</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required autofocus />
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
        <p id="loginError" class="error-message"></p>
      </form>
    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div id="dashboard" class="dashboard hidden">
    <aside class="sidebar">
      <h2>Admin</h2>
      <nav>
        <a href="#" data-tab="messages" class="active"><i class="fas fa-envelope"></i> Messages</a>
        <a href="#" data-tab="info"><i class="fas fa-store"></i> Informations</a>
        <a href="#" data-tab="menu"><i class="fas fa-utensils"></i> Menu</a>
        <a href="#" data-tab="hours"><i class="fas fa-clock"></i> Horaires</a>
        <a href="#" data-tab="reviews"><i class="fas fa-star"></i> Avis</a>
        <a href="#" data-tab="socials"><i class="fas fa-share-alt"></i> Réseaux sociaux</a>
        <a href="#" data-tab="gallery"><i class="fas fa-images"></i> Galerie</a>
      </nav>
      <button id="logoutBtn" class="btn btn-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
    </aside>

    <main class="content">
      <header class="content-header">
        <h1 id="pageTitle">Messages</h1>
        <a href="/" target="_blank" class="btn btn-secondary"><i class="fas fa-external-link-alt"></i> Voir le site</a>
      </header>

      <!-- Onglet Messages -->
      <section id="tab-messages" class="tab-content active">
        <div id="messagesList" class="messages-list"></div>
      </section>

      <!-- Onglet Informations -->
      <section id="tab-info" class="tab-content">
        <form id="infoForm" class="admin-form">
          <div class="form-row">
            <div class="form-group"><label>Nom du restaurant</label><input type="text" id="infoName" /></div>
            <div class="form-group"><label>Slogan</label><input type="text" id="infoTagline" /></div>
          </div>
          <div class="form-group"><label>Description</label><textarea id="infoDescription" rows="3"></textarea></div>
          <div class="form-row">
            <div class="form-group"><label>Téléphone</label><input type="text" id="infoPhone" /></div>
            <div class="form-group"><label>WhatsApp (format international sans espaces)</label><input type="text" id="infoWhatsapp" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Email</label><input type="email" id="infoEmail" /></div>
            <div class="form-group"><label>Adresse</label><input type="text" id="infoAddress" /></div>
          </div>
          <div class="form-group"><label>Google Maps (URL embed)</label><input type="text" id="infoMapEmbed" /></div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
        </form>
      </section>

      <!-- Onglet Menu -->
      <section id="tab-menu" class="tab-content">
        <div id="menuEditor"></div>
        <button id="addCategoryBtn" class="btn btn-secondary" style="margin-top:20px;"><i class="fas fa-plus"></i> Ajouter une catégorie</button>
        <button id="saveMenuBtn" class="btn btn-primary" style="margin-top:20px;"><i class="fas fa-save"></i> Enregistrer le menu</button>
      </section>

      <!-- Onglet Horaires -->
      <section id="tab-hours" class="tab-content">
        <div id="hoursEditor"></div>
        <button id="addHourBtn" class="btn btn-secondary" style="margin-top:20px;"><i class="fas fa-plus"></i> Ajouter une plage</button>
        <button id="saveHoursBtn" class="btn btn-primary" style="margin-top:20px;"><i class="fas fa-save"></i> Enregistrer</button>
      </section>

      <!-- Onglet Avis -->
      <section id="tab-reviews" class="tab-content">
        <div id="reviewsEditor"></div>
        <button id="addReviewBtn" class="btn btn-secondary" style="margin-top:20px;"><i class="fas fa-plus"></i> Ajouter un avis</button>
        <button id="saveReviewsBtn" class="btn btn-primary" style="margin-top:20px;"><i class="fas fa-save"></i> Enregistrer</button>
      </section>

      <!-- Onglet Réseaux sociaux -->
      <section id="tab-socials" class="tab-content">
        <div id="socialsEditor"></div>
        <button id="addSocialBtn" class="btn btn-secondary" style="margin-top:20px;"><i class="fas fa-plus"></i> Ajouter un réseau</button>
        <button id="saveSocialsBtn" class="btn btn-primary" style="margin-top:20px;"><i class="fas fa-save"></i> Enregistrer</button>
      </section>

      <!-- Onglet Galerie -->
      <section id="tab-gallery" class="tab-content">
        <div id="galleryEditor"></div>
        <button id="addGalleryBtn" class="btn btn-secondary" style="margin-top:20px;"><i class="fas fa-plus"></i> Ajouter une image</button>
        <button id="saveGalleryBtn" class="btn btn-primary" style="margin-top:20px;"><i class="fas fa-save"></i> Enregistrer</button>
      </section>

      <!-- Notification -->
      <div id="toast" class="toast"></div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
